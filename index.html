<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#edf2fa">
    <title>Ashan Pro</title>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="ashan-logo.png" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body class="light-theme">

    <div class="background" id="background"></div>

    <header class="top-bar">
        <a class="brand" href="index.html">
            <span>Ashan Pro 27.1</span>
        </a>

        <button class="settings-toggle" id="settingsToggle" type="button" aria-label="Настройки">
            <i class="fa-solid fa-gear"></i>
        </button>
    </header>

    <main class="main">
        <div class="welcome">
            <h1 id="greeting">Добро пожаловать</h1>
            <div class="welcome-line">
                <span id="clock">--:--</span>
                <span class="datetime-dot"></span>
                <span id="date">Загрузка даты</span>
            </div>
        </div>

        <form class="search-wrapper glass" id="searchForm">
            <input id="searchInput" type="search" placeholder="Поиск в Google" autocomplete="off" autocapitalize="off"
                spellcheck="false">

            <button class="glass-control voice-action" id="voiceButton" type="button" aria-label="Голосовой поиск">
                <i class="fa-solid fa-microphone"></i>
            </button>

            <button class="glass-control" type="submit" aria-label="Искать">
                <i class="fa-solid fa-magnifying-glass"></i>
            </button>
        </form>

        <div class="current-engine glass" id="currentEngine" aria-live="polite">
            <span class="current-engine-name" id="currentEngineName">Google</span>
        </div>
    </main>

    <div class="settings-overlay" id="settingsOverlay" aria-hidden="true">
        <div class="settings-window glass" id="settingsWindow">

            <div class="settings-header">
                <h1>Настройки</h1>
                <button class="close-settings settings-close" id="closeSettings" type="button" aria-label="Закрыть">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <section class="settings-section">
                <h2>Поисковая система</h2>
                <div class="engines" id="engines">
                    <span class="engine-indicator" aria-hidden="true"></span>
                </div>
            </section>

            <section class="settings-section">
                <h2>Внешний вид</h2>
                <div class="theme-controls" id="themeControls">
                    <span class="theme-indicator" aria-hidden="true"></span>
                    <button class="theme-button" type="button" data-theme="light" aria-pressed="true">Светлая</button>
                    <button class="theme-button" type="button" data-theme="dark" aria-pressed="false">Тёмная</button>
                    <button class="theme-button" type="button" data-theme="system" aria-pressed="false">Система</button>
                </div>
            </section>

            <section class="settings-section">
                <div class="section-heading">
                    <h2>Liquid Glass</h2>
                    <div class="value-pill">
                        <input id="glassNumber" type="number" min="0" max="100" value="75">
                        <span>%</span>
                    </div>
                </div>
                <input id="glassRange" type="range" min="0" max="100" value="75">
            </section>

            <section class="settings-section animation-setting">
                <h2>Анимации</h2>
                <label class="switch">
                    <input id="animationsToggle" type="checkbox" checked>
                    <span class="switch-track"></span>
                </label>
            </section>

            <section class="settings-section">
                <h2>Обои</h2>
                <div class="wallpapers" id="wallpapers"></div>

                <div class="wallpaper-actions">
                    <label class="upload-wallpaper" for="wallpaperUpload">
                        <i class="fa-solid fa-image"></i>
                        Загрузить свои обои
                        <input id="wallpaperUpload" type="file" accept="image/*">
                    </label>

                    <button class="reset-button" id="resetDefaults" type="button">
                        Сбросить настройки
                    </button>
                </div>
            </section>

            <div class="settings-footer">
                Ashan Pro 27.1 · Настройки сохраняются автоматически
            </div>

        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="script.js"></script>
</body>

</html>
